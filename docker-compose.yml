version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: localpickup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: localpickup
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d localpickup"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: localpickup-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/localpickup?schema=public"
      JWT_SECRET: "localpickup-production-super-secure-key-min32chars"
      FRONTEND_URL: "http://localhost:5173"
      UPLOAD_DIR: "/app/uploads"
      DOCUMENT_RETENTION_HOURS: 24
    ports:
      - '5000:5000'
    volumes:
      - document_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: localpickup-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  postgres_data:
  document_uploads:
